spring.application.name=resmat

spring.mustache.prefix=classpath:/templates/
spring.mustache.suffix=.hbs

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/resmat}
spring.datasource.username=${DB_USER:resmat}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.show-sql=true
# Mise a jour automatique de la Db en fonction des entities
spring.jpa.hibernate.ddl-auto=update


# quotes ajoutees sur les noms de tables et de champs : preserve la casse
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

#spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# logs the SQL statements
# basic log level for all messages
logging.level.org.hibernate=info
# SQL statements and parameters
logging.level.org.hibernate.SQL=debug
logging.level.org.hibernate.orm.jdbc.bind=${SQL_BIND_LOG_LEVEL:off}




